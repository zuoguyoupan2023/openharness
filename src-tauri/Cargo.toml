[package]
name = "openharness"
version = "0.1.0"
description = "OpenHarness —— DeepSeek Harness 桌面壳"
authors = ["openharness"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：启用 Window::add_child 等运行时子 webview API（官方 multiwebview 示例同样依赖）
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# 更新流程：确定后重启整个 app（relaunch）
tauri-plugin-process = "2"
# 单实例：多实例会并发抢 3080 / 互删 npm 私有缓存（ECOMPROMISED 与 JSON.parse 空文件的根源）
tauri-plugin-single-instance = "2"
# 本地 dsh 插件安装：原生文件/目录选择对话框（选 .tgz 或插件目录）
# 注意：依赖树要求 rustc ≥ 1.88，需用 rustup 的 stable（本机 1.97）而非 Homebrew rustc 1.86。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 关键：添加 tokio 用于异步子进程管理
tokio = { version = "1", features = ["full"] }
# 用于退出时回收 DSH 子进程组（kill(-pgid)）
libc = "0.2"
# Node.js 缺失时：下载官方/镜像预编译包（reqwest 流式下载 + tar.gz 解压）
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
# DSH web 设置变更事件订阅（/api/events.host，WebSocket）
tokio-tungstenite = "0.24"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
# 真实可用终端：为 shell 子进程分配伪终端（PTY），解锁 vim/htop 等全屏 TUI
# 取自 WezTerm 作者，跨 Unix/Windows，macOS 走 /dev/ptmx 原生 PTY。
portable-pty = "0.8"
