[package]
name = "openharness"
version = "0.1.0"
description = "OpenHarness —— DeepSeek Harness 桌面壳"
authors = ["openharness"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：启用 Window::add_child 等运行时子 webview API（官方 multiwebview 示例同样依赖）
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 关键：添加 tokio 用于异步子进程管理
tokio = { version = "1", features = ["full"] }
# 用于退出时回收 DSH 子进程组（kill(-pgid)）
libc = "0.2"
